networks:
  social-network:
    driver: bridge

services:
  load-balancer:
    image: nginx
    container_name: social-network-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    networks:
      - social-network
    volumes:
      - ./docker/nginx:/etc/nginx/conf.d
  app:
    build:
      args:
        port: 8000
      dockerfile: ./.docker/app/Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - social-network
  db:
    container_name: social-media-db
    image: postgres:15
    restart: unless-stopped
    networks:
      - social-network
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "6543:5432"
    environment:
      POSTGRES_DB: social_media_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/18

volumes:
  postgres_data:
    driver: local
